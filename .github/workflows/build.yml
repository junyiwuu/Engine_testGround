name: Build
run-name: ${{ github.actor }} is building the project  #github.actor is my name

on: [push]                                       # the condition trigger CI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.4.304.1
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Check out repository code                     # official checkout, pull current code to runner 
        uses: actions/checkout@v4
        with:
          submodules: recursive


      - name: Restore shaderc cache
        uses: actions/cache@v3
        with:
          path: /usr/local/lib
          key: shaderc-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            shaderc-${{ runner.os }}-
          
          # for ccache. also need to write in cmake

      - name: Notify repository has been cloned
        run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."

      - name: Install GLFW
        run: |
          sudo apt update
          sudo apt install -y libglfw3 libglfw3-dev

      - name: Install  GLM
        run: sudo apt install -y libglm-dev
      
      - name: Install Assimp
        run: sudo apt install -y libassimp-dev

      - name: Install glsl
        run: |
          if [! -f /usr/local/bin/glslc ]; then
            sudo apt update
            sudo apt install -y git cmake python3 python3-pip build-essential
            git clone https://github.com/google/shaderc.git
            cd shaderc
            python3 ./utils/git-sync-deps
            mkdir build
            cd build
            cmake -GNinja ..
            ninja
            sudo ninja install
            echo "export PATH=/usr/local/bin:$PATH" >> $HOME/.bashrc
            source $HOME/.bashrc
          else
            echo "shaderc already installed, skip build"
          fi

      - name: Save shaderc cache
        uses: actions/cache@v3
        with:
          path: /usr/local/lib
          key: shaderc-${{ runner.os }}-${{ github.sha }}

      - name: Install stb_image
        run: |
          mkdir -p external/stb
          wget -O external/stb/stb_image.h https://raw.githubusercontent.com/nothings/stb/master/stb_image.h

      - name: Check build.sh exists
        run: ls -l build.sh

      - name: Make build.sh executable
        run: chmod +x build.sh
          

      - name: Build project
        run: sh build.sh